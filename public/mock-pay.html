<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دفع العربون (تجريبي) — سواك</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/mock-pay.js"></script>
</head>
<body>
  <main class="container">
    <div class="pay-wrap">
      <a class="brand" href="/"><img src="/img/logo.svg" alt="" width="40" height="40"><span>سواك<small>دفع العربون</small></span></a>
      <div class="alert alert-warn" role="note">
        <b>وضع تجريبي:</b> هذه بوابة دفع وهمية للتطوير فقط، ولن يُخصم أي مبلغ. في الموقع الحقيقي يتم التحويل إلى Stripe أو Tap.
      </div>
      <div class="panel">
        <div class="card-visual">
          <div>SIWAK · TEST</div>
          <div class="num">4242 4242 4242 4242</div>
          <div class="row2"><span>TEST USER</span><span>12/30</span></div>
        </div>
        <div class="ticket" id="details"><div class="loading"><span class="spinner"></span></div></div>
        <div class="alert alert-error hidden" id="err" role="alert"></div>
        <button class="btn btn-primary btn-block" id="pay" disabled><span data-icon="lock"></span> ادفع العربون</button>
        <button class="btn btn-ghost btn-block" id="fail">محاكاة فشل / إلغاء الدفع</button>
      </div>
    </div>
  </main>
</body>
</html>
